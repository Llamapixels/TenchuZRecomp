; Modern Look - F6 > Shader settings. The n-th slider/checkbox is XeUser(n)
; in 822F99ECDB1B0ACD.ps.hlsl, so keep this order in step with LoadSettings().
;   slider   = key | Label | min | max | default | Tooltip
;   checkbox = key | Label | default | Tooltip

description = Sharpening, clarity, bloom, smooth highlights and colour grading on top of the game's own image.

slider   = sharpen         | Sharpen            | 0    | 1    | 0.50 | Crisper edges and texture detail.
slider   = clarity         | Clarity            | 0    | 1    | 0.35 | Local contrast: makes surfaces and shapes pop.
slider   = bloom           | Bloom              | 0    | 2    | 0.40 | Glow around bright areas.
slider   = bloom_threshold | Bloom threshold    | 0    | 1    | 0.60 | How bright something must be to glow. Lower = more things glow.
slider   = bloom_size      | Bloom size         | 0.25 | 3    | 1.00 | Radius of the glow.
slider   = bloom_haze      | Bloom haze         | 0    | 1    | 0.40 | 0 = tight glow, 1 = wide soft haze over the scene.
slider   = highlights      | Highlight roll-off | 0.5  | 1    | 0.80 | Brightness where highlights start to fade smoothly instead of clipping. 1 = off.
slider   = exposure        | Exposure           | 0.5  | 2    | 1.00 | Overall brightness.
slider   = contrast        | Contrast           | 0.5  | 1.5  | 1.12 | 1 = unchanged.
slider   = saturation      | Saturation         | 0    | 2    | 1.15 | 1 = unchanged, 0 = black and white.
slider   = vibrance        | Vibrance           | 0    | 1    | 0.20 | Boosts dull colours more than vivid ones.
slider   = warmth          | Warmth             | -0.2 | 0.2  | 0.03 | + warmer (orange), - cooler (blue).
slider   = shadow_lift     | Shadow lift        | 0    | 0.15 | 0.00 | Raises the darkest parts of the image.
slider   = vignette        | Vignette           | 0    | 1    | 0.30 | Darkens the screen edges.
checkbox = compare         | Split-screen compare | 0  | Shows the game's original image on the left half.

; Puddle water (79481E88F9E67594.ps.hlsl), XeUser(15) onwards. Puddles only:
; rivers and other water use shaders that are not replaced.
slider   = water_ripples      | Puddle ripples     | 0    | 1.5  | 0.50 | Strength of the small animated waves on puddles.
slider   = water_ripple_size  | Puddle ripple size | 0.25 | 4    | 1.00 | Wavelength of the ripples.
slider   = water_ripple_speed | Puddle ripple speed| 0    | 3    | 1.00 | How fast the ripples move. 0 = frozen.
slider   = water_distortion   | Puddle distortion  | 0    | 2    | 0.50 | How much the ripples bend the reflection.
slider   = water_reflection   | Puddle reflection  | 0    | 2    | 1.00 | Extra reflection at shallow viewing angles (fresnel).
slider   = water_glint        | Puddle glint       | 0    | 3    | 1.00 | Sharp sparkles of light on the ripples.
slider   = water_depth_tint   | Puddle depth tint  | 0    | 1    | 0.30 | Darkens and cools the water seen from above.

; Depth effects (822F99ECDB1B0ACD.ps.hlsl), XeUser(22) onwards.
slider   = ao                 | Ambient occlusion  | 0    | 2     | 0.80  | Soft shadows in corners, creases and where objects meet the ground.
slider   = ao_radius          | AO radius          | 10   | 200   | 60    | Size of the shadowed area around contacts, in world units (about cm).
slider   = fog                | Atmospheric haze   | 0    | 1     | 0.35  | Distant things fade into the air.
slider   = fog_distance       | Haze distance      | 500  | 30000 | 6000  | How quickly the haze builds up with distance (world units).
slider   = fog_tint           | Haze tint          | -1   | 1     | -0.30 | -1 = cool blue night air, 1 = warm dusty air.
slider   = dof                | Depth of field     | 0    | 1     | 0.40  | Softens the background behind your character.
slider   = dof_distance       | DOF start          | 1.2  | 10    | 3.00  | Blur starts at this many times your character's distance from the camera.
slider   = shafts             | Light shafts       | 0    | 2     | 0.50  | Rays streaming down from bright sky and distant lights.
slider   = shafts_length      | Shaft length       | 0.1  | 1     | 0.50  | How far the rays reach across the screen.
