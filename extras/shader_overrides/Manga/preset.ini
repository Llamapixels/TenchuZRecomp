; Manga - F6 > Shader settings. The n-th slider/checkbox is XeUser(n) in
; 822F99ECDB1B0ACD.ps.hlsl, so keep this order in step with LoadSettings().
;   slider   = key | Label | min | max | default | Tooltip
;   checkbox = key | Label | default | Tooltip

description = Ink outlines, flat tone bands and screentone dots. Turn up Colour for a colour comic.

slider   = colour         | Colour             | 0   | 1   | 0.00 | 0 = black and white manga, 1 = colour comic.
slider   = ink            | Ink lines          | 0   | 1   | 0.85 | Strength of the outlines.
slider   = line_width     | Line width         | 0.5 | 4   | 1.00 | Outline thickness, in 1080p pixels (rounded to whole screen pixels).
slider   = line_detail    | Line detail        | 0   | 1   | 0.50 | 0 = only strong outlines, 1 = ink every detail.
slider   = tone_levels    | Tone levels        | 2   | 6   | 4.00 | How many flat shades the image is cut into.
slider   = tone_size      | Screentone size    | 1   | 10  | 4.00 | Spacing of the halftone dots.
slider   = tone_strength  | Screentone         | 0   | 1   | 1.00 | 0 = flat grey shades, 1 = halftone dots.
slider   = brightness     | Brightness         | 0.5 | 3   | 1.40 | Brightens the scene before it is toned.
slider   = contrast       | Contrast           | 0.5 | 2   | 1.20 | Spreads the shades apart.
slider   = paper          | Paper              | 0   | 1   | 0.60 | 0 = pure white, 1 = old yellowed paper.
checkbox = compare        | Split-screen compare | 0 | Shows the game's original image on the left half.
