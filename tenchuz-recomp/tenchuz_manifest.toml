# --- Guest CRT setjmp()/longjmp() ------------------------------------------
# Tenchu Z statically links the Xbox 360 CRT, so setjmp/longjmp are guest
# functions rather than imports:
#   0x82657B00  setjmp(env)  -> saves f14-f31/r13-r31/cr/lr/r1 into env
#   0x826578C0  longjmp(env,val) -> restores that context and `blr`s to the
#                                    saved LR (a non-local return)
# The recompiler's default call lowering turns that `blr` into a plain C++
# `return`, so control comes back to the *immediate* caller with a clobbered
# r1 (r1 drift) instead of resuming at the setjmp site. ReXGlue supports the
# pair natively via these two keys: they lower the call sites to host
# setjmp()/longjmp() keyed on the guest env pointer, and the emitted
# `if (tmp != 0) ctx = env;` restores the full guest register context.
# NOTE: 0x82657B00 is a leaf function absent from .pdata (the usual caveat);
# it is auto-discovered as a call target, so it is registered without help.
setjmp_address = 0x82657B00
longjmp_address = 0x826578C0

