#
# Two categories of address land here:
#   1. codegen `Unresolved b target` / `Unresolved conditional branch` targets
#      (branch destinations the analyzer saw but did not treat as functions).
#   2. Runtime `[FATAL] Call to invalid or unregistered function` addresses
#      observed during boot tests -- guest call targets the static scan did not
#      cover (materialized from immediates, or function-table boundaries).
#
# tools/generate_manifest.py merges this file into the manifest.
