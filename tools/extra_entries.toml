# --- Code-materialised callback arguments (batch 2026-10-19) ---------------
# Third category: callbacks built in CODE and passed as an argument to a
# registration routine, so they never appear in .rdata and
# derive_fnptr_targets.py cannot see them. Example 0x823B8720:
#   addis r5, r0, 0x823C ; addi r5, r5, 0x8720 ; bl 0x822A2100
# Observed as: [FATAL] Call to invalid or unregistered function 0x823B8720
# Every one of these is also listed in entry_points_keep.toml, which is what
# makes generate_manifest.py keep them instead of classifying them as
# intra-function LABELs (they are all leaf functions that .pdata omits).
# Provenance + safety checks: tools/scan_fnptr_args.py,
# tools/verify_fnptr_candidates.py, tools/check_branch_targets.py.

