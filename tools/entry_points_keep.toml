# --- Code-materialised callback arguments (batch 2026-10-19) ---------------
# tools/derive_fnptr_targets.py only scans DATA pointers in .rdata. A second
# class of guest callback is instead built in CODE and handed to a
# registration routine as an argument, e.g. 0x823B8720 (a leaf function that
# writes 1 to global 0x833AE0D0):
#
#   addis r5, r0, 0x823C
#   addi  r5, r5, 0x8720        ; r5 = 0x823B8720
#   bl    0x822A2100            ; register(handler)
#
# Such an address never appears in .rdata, so the recompiler had no entry for
# it and the runtime died with:
#   [FATAL] Call to invalid or unregistered function at guest address 0x823B8720
#
# They are keep-listed (not put in extra_entries.toml) because every one of
# them sits behind a leaf `blr`/`bctr` and .pdata omits leaf functions, so
# tools/classify_entry_points.py calls them LABELs and would drop them.
# KEEP is the safe route: tools/check_branch_targets.py confirms no `b`/`bc`
# targets any of these, so registering them emits no conditional tail call
# and cannot reintroduce the r1-drift bug.
#
# Provenance: tools/scan_fnptr_args.py (arg register r3..r10 fed by
# lis+addi/ori, 4-byte aligned, a call within 8 instructions, register not
# clobbered) -> tools/verify_fnptr_candidates.py (predecessor is a function
# terminator, not an interior label) -> tools/check_branch_targets.py.
# 26 candidates, 25 kept; 0x82666314 rejected (resume/return-address label
# right after a `bl`, stored to 2712(r1) -- not a function).

